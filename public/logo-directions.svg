<text x="681" y="770" font-family="Georgia, serif" font-size="76" letter-spacing="-6">AR<tspan fill="#255b46">.</tspan></text>
<g font-size="14" text-anchor="middle">
<text x="266" y="330">Clear. Quiet. Confident.</text><text x="734" y="330">Compact. Recognizable. App-ready.</text>
<text x="266" y="572">Technical. Direct. Familiar.</text><text x="734" y="572">Distinctive. Geometric. Personal.</text>
<text x="266" y="814">Abstract symbol + full name.</text><text x="734" y="814">Refined. Typographic. Established.</text>
</g>
<g font-size="11" text-anchor="middle" fill="#667168">
<text x="266" y="352">A clean evolution of the original AR.</text><text x="734" y="352">Works equally well as a favicon.</text>
<text x="266" y="594">An explicit connection to software development.</text><text x="734" y="594">A and R share a structural stroke.</text>
<text x="266" y="836">An icon that can stand on its own.</text><text x="734" y="836">A serif alternative to the handwritten style.</text>
</g>
