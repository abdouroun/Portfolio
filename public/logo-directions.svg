<text x="66" y="183">01 / THE WORDMARK</text><text x="534" y="183">02 / THE TILE</text>
<text x="66" y="425">03 / THE DEVELOPER</text><text x="534" y="425">04 / THE MONOGRAM</text>
<text x="66" y="667">05 / THE SYMBOL</text><text x="534" y="667">06 / THE EDITORIAL</text>
