<text x="44" y="48" font-size="12" letter-spacing="3" fill="#255b46">ABDELMOUHAIMINE ROUN / IDENTITY EXPLORATIONS</text>
<text x="44" y="92" font-size="32" letter-spacing="-1">Six directions. One identity.</text>
<text x="44" y="122" font-size="14" fill="#667168">A comparison of marks for your portfolio — no signature lettering.</text>
